name: Publish website to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['dist/**', 'scripts/**', 'research/**', 'data/**', '.github/workflows/**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      site-ref:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.site-ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install lxml==5.4.0
      - name: Check source, catalogue and prepared site
        run: |
          python -m unittest discover -s scripts/tests -v
          bash scripts/check.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runner
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Browser regression tests
        run: |
          mkdir -p /tmp/preview
          ln -s "$GITHUB_WORKSPACE/.github-pages" /tmp/preview/steklofurnitura
          python3 -m http.server 8000 --directory /tmp/preview >/tmp/preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:8000/steklofurnitura/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/browser_checks.cjs
          node scripts/map_checks.cjs
          node scripts/layout_checks.cjs
          node scripts/pdf_checks.cjs
          node scripts/motion_checks.cjs
          node scripts/price_checks.cjs
          node scripts/premium_checks.cjs
          node scripts/utility_checks.cjs
          node scripts/search_checks.cjs
          node scripts/search_browser_checks.cjs
          node scripts/search_visual_checks.cjs
      - name: Confirm failed validation blocks publishing
        run: |
          mv .github-pages/products.json .github-pages/products.disabled
          if python3 scripts/verify_pages.py; then
            echo 'ERROR: invalid site passed validation'
            exit 1
          fi
          mv .github-pages/products.disabled .github-pages/products.json
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: .github-pages
  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Confirm this validated commit is still current main
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.site-ref || github.sha }}
        run: |
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test "$current_sha" = "$EXPECTED_SHA"
      - uses: actions/configure-pages@v6
      - name: Deploy validated artifact
        id: deployment
        uses: actions/deploy-pages@v4
