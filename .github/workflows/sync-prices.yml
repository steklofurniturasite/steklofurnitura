name: Synchronize official catalogue prices
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: official-price-sync
  cancel-in-progress: false
jobs:
  synchronize:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install lxml==5.4.0
      - name: Parser and safety tests
        run: python -m unittest discover -s scripts/tests -v
      - name: Compare every exact official article and apply complete verified batch
        run: python scripts/sync_prices.py --apply
      - name: Validate regenerated site and all catalogue data
        run: bash scripts/check.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser runner
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Verify prices, enquiry, navigation and map before committing
        run: |
          mkdir -p /tmp/preview
          ln -s "$GITHUB_WORKSPACE/.github-pages" /tmp/preview/steklofurnitura
          python3 -m http.server 8000 --directory /tmp/preview >/tmp/preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:8000/steklofurnitura/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/browser_checks.cjs
          node scripts/map_checks.cjs
          node scripts/motion_checks.cjs
          node scripts/price_checks.cjs
          node scripts/premium_checks.cjs
      - name: Save short report
        run: |
          cp .price-sync/summary.json data/price-sync-summary.json
          python scripts/price_report.py >> "$GITHUB_STEP_SUMMARY"
      - name: Commit validated batch; concurrent edits block a stale push
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/prices.json data/price-sync-summary.json dist
          if ! git diff --cached --quiet; then
            git commit -m 'Synchronize verified official prices'
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Preserve evidence, comparison, errors and original data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-price-evidence-${{ github.run_id }}
          path: .price-sync/
          include-hidden-files: true
          retention-days: 30
  publish:
    needs: synchronize
    uses: ./.github/workflows/pages.yml
    with:
      site-ref: ${{ needs.synchronize.outputs.commit }}
    permissions:
      contents: read
      pages: write
      id-token: write
